<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio social preview</title>
    <style>
      @font-face {
        font-family: Space;
        src: url("/fonts/space-grotesk-latin.woff2");
        font-weight: 400 700;
      }
      @font-face {
        font-family: DM;
        src: url("/fonts/dm-sans-latin.woff2");
        font-weight: 400 700;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #111210;
        color: #efeee7;
        font-family: DM, Arial, sans-serif;
      }
      .frame {
        position: absolute;
        inset: 24px;
        border: 1px solid #36392e;
        pointer-events: none;
      }
      .top {
        position: absolute;
        left: 63px;
        top: 51px;
        font: 600 33px Space;
        letter-spacing: -2px;
      }
      .top span {
        color: #ff794b;
      }
      .label {
        position: absolute;
        top: 66px;
        right: 61px;
        color: #a1aa8e;
        font: 9px Space;
        letter-spacing: 2px;
      }
      .copy {
        position: absolute;
        left: 65px;
        top: 155px;
        z-index: 2;
      }
      .copy > p {
        font: 9px Space;
        letter-spacing: 2px;
        color: #ff794b;
        margin: 0 0 20px;
      }
      .copy > h1 {
        font: 500 86px/0.99 Space;
        letter-spacing: -6px;
        margin: 0;
      }
      .copy > h1 span {
        color: #ff794b;
      }
      .copy > div {
        font-size: 16px;
        line-height: 1.8;
        color: #a6ac99;
        margin-top: 24px;
      }
      .bottom {
        position: absolute;
        left: 65px;
        bottom: 58px;
        color: #96a17f;
        font: 8px Space;
        letter-spacing: 1.7px;
      }
      .bottom:before {
        content: "";
        display: inline-block;
        width: 25px;
        height: 1px;
        background: #ff794b;
        vertical-align: middle;
        margin-right: 15px;
      }
      #social-scene {
        position: absolute;
        width: 670px;
        height: 610px;
        right: 8px;
        top: 30px;
      }
      #social-scene canvas {
        width: 100%;
        height: 100%;
      }
      #social-skills {
        position: absolute;
        left: -10000px;
        width: 300px;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="top">deba<span>.</span></div>
    <div class="label">BEYOND THE INTERFACE / PORTFOLIO</div>
    <div class="copy">
      <p>FRONTEND CRAFT. FULL-STACK THINKING.</p>
      <h1>Debajyoti<br />Maity<span>.</span></h1>
      <div>
        Turning complex ideas into<br />experiences that feel effortless.
      </div>
    </div>
    <div class="bottom">ANGULAR / REACT / IONIC / FULL-STACK</div>
    <div id="social-scene"></div>
    <div id="social-skills"></div>
    <script type="module">
      import { createScenes } from "/src/scene.js";
      window.cardScene = createScenes({
        hero: document.querySelector("#social-scene"),
        skills: document.querySelector("#social-skills"),
        paused: true,
      });
    </script>
  </body>
</html>
